<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Shift Scheduling</title>
  <link rel="stylesheet" href="/static/app.css?v=14">
  <script type="module" src="/static/app.js?v=28"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Shift Scheduling home">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <path d="M7 3v5M17 3v5M3 11h18M8 15h3M8 18h7"></path>
        </svg>
      </span>
      <span>Shift Scheduling</span>
    </a>
    <button id="logout-button" class="button secondary" type="button" hidden>
      Sign out
    </button>
  </header>

  <main>
    <p id="loading" class="loading" role="status">Opening your workspace…</p>

    <section id="login-view" class="card login-card" hidden
             aria-labelledby="login-heading">
      <div class="card-heading">
        <p class="eyebrow">WORKSPACE ACCESS</p>
        <h1 id="login-heading">Sign in</h1>
        <p class="description">Use your workplace account to continue.</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" maxlength="1024" required>
        </div>
        <p id="login-message" class="message" role="alert" hidden></p>
        <button id="login-button" class="button primary" type="submit">
          Sign in
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>

    <section id="account-view" class="card account-card" hidden
             aria-labelledby="account-heading">
      <div class="card-heading">
        <p class="eyebrow">YOUR WORKSPACE</p>
        <h1 id="account-heading">Account</h1>
        <p class="description">You’re signed in to Shift Scheduling.</p>
      </div>
      <dl class="account-details">
        <div>
          <dt>Email address</dt>
          <dd id="account-email"></dd>
        </div>
        <div>
          <dt>Your permissions</dt>
          <dd id="account-permissions" class="permission-list"></dd>
        </div>
      </dl>
      <p id="account-message" class="message" role="alert" hidden></p>
    </section>
    <noscript>
      <p class="message">Enable JavaScript to sign in to your workspace.</p>
    </noscript>
  </main>
  <footer>Shift Scheduling</footer>
</body>
</html>
